<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Memory Match</h1>
      <select id="size" aria-label="Board size">
        <option value="6">Easy · 12 cards</option>
        <option value="8" selected>Medium · 16 cards</option>
        <option value="12">Hard · 24 cards</option>
      </select>
    </header>

    <div class="stats">
      <span>Moves <strong id="moves">0</strong></span>
      <span>Time <strong id="time">0:00</strong></span>
      <span>Best <strong id="best">–</strong></span>
    </div>

    <div id="board"></div>

    <p id="message" aria-live="polite"></p>
    <button id="restart">New game</button>
  </main>

  <script src="game.js"></script>
  <script src="script.js"></script>
</body>
</html>
